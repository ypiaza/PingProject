<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Chat Ping 💬</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        #mensagens {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }

        .msg {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <h2>Chat em Tempo Real 🚀</h2>
    <div id="mensagens"></div>

    <input type="text" id="inputMensagem" placeholder="Digite sua mensagem...">
    <button onclick="enviarMensagem()">Enviar</button>

    <script>
        // Conecta ao servidor WebSocket do FastAPI 
        // Substitua o seu token de teste retornado pelo /login na string abaixo ⬇
        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJzdHJpbmciLCJleHAiOjE3OTA4MTk0NDZ9.YFUetu8G1BqxXyY7uMsT4tMDwTtuhYjlDjnx6Jsq7To";

        const ws = new WebSocket(`ws://127.0.0.1:8000/ws/chat?token=${token}`);

        const mensagensDiv = document.getElementById("mensagens");
        const inputMensagem = document.getElementById("inputMensagem");

        // Executado quando recebe uma nova mensagem do servidor 
        ws.onmessage = function (event) {
            const novaMensagem = document.createElement("div");
            novaMensagem.className = "msg";
            novaMensagem.textContent = event.data;
            mensagensDiv.appendChild(novaMensagem);
            mensagensDiv.scrollTop = mensagensDiv.scrollHeight; // Rola até o final
        };

        // Função para enviar mensagem 
        function enviarMensagem() {
            if (inputMensagem.value.trim() !== "") {
                ws.send(inputMensagem.value);
                inputMensagem.value = "";
            }
        }
    </script>
</body>

</html>
