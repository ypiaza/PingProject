<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
    <form id="login">
        <label for="user">Usuario:</label>
        <input type="text" name="user" id="userLogin">
        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="userSenha">
        <button type="submit">entrar</button>
    </form>

    <div id="container"></div>

    <script>
        const container = document.getElementById("container")
        const formLogin = document.getElementById("login")

        formLogin.addEventListener("submit", async (e) => {
            e.preventDefault();

            const user = document.getElementById("userLogin").value
            const senha = document.getElementById("userSenha").value

            try {
                const res = await fetch("http://127.0.0.1:8000/users");

                
                if(!res.ok){
                    console.log("ERRADO", validation.status)
                }
                
                const validation = await res.json()

                console.log(validation)

                validation.map((item) => {
                    if(item.login == user && item.senha == senha){
                        container.innerHTML = `<h1>Parabéns, você é realmente capaz</h1><br><h1>${user} entrou!</h1>`
                    } else{
                        container.innerHTML = "Falta algo..."
                    }
                })

            } catch (error) {
                console.error(error)
            }
        })

    </script>
</body>

</html>
